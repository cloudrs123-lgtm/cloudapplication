# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - p1-appservice

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v7

      # Use Node.js 22
      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      # Install backend dependencies
      - name: Install dependencies
        working-directory: ./backend/backend
        run: npm install

      # Build and test backend
      - name: Build and test
        working-directory: ./backend/backend
        run: |
          npm run build --if-present
          npm run test --if-present

      # Upload only the actual backend application
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend/backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Download backend artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      # Deploy to Azure App Service
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'p1-appservice'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F676E34090C54716AEA201880E128E16 }}
